apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-config
  namespace: cloudops
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_PORT: "3000"
  WORKER_METRICS_PORT: "9091"
  DIAGNOSTICS_URL: "http://diagnostics:8000"
  CLOUD_PROVIDER: "mock"
  AWS_REGION: "us-east-1"
  AWS_READ_ONLY: "true"
  ENABLE_AWS_MUTATIONS: "false"
  WORKER_CONCURRENCY: "2"
  WORKER_MAX_ATTEMPTS: "5"
  DEFAULT_WORKSPACE_ID: "ws_demo_acme"
