openapi: 3.0.3
info:
  title: CloudOps Sentinel API
  version: 1.0.0
  description: |
    Cloud operations automation platform. Authenticate with JWT from `POST /api/v1/auth/login`.
    All mutating diagnostic and remediation calls require an idempotency key.
  contact:
    name: Platform Engineering
servers:
  - url: http://localhost:3000
    description: Local docker compose
tags:
  - name: Health
  - name: Auth
  - name: Resources
  - name: Diagnostics
  - name: Remediations
  - name: Audit
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              example: { status: live }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200':
          description: Dependencies are reachable
        '503':
          description: Not ready
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      responses:
        '200':
          description: Text exposition format
  /docs:
    get:
      tags: [Health]
      summary: Swagger UI
      responses:
        '200':
          description: HTML documentation
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Issue a JWT
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: admin@cloudops.local
              password: CloudOps!demo
      responses:
        '200':
          description: Token issued
        '401':
          description: Invalid credentials
  /api/v1/resources/sync:
    post:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: Discover and upsert cloud inventory
      requestBody:
        content:
          application/json:
            example: { types: [ec2, s3, lambda] }
      responses:
        '202':
          description: Inventory synced
  /api/v1/resources:
    get:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: List resources
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: type
          schema: { type: string, enum: [ec2, s3, lambda, cloudwatch] }
      responses:
        '200':
          description: Paginated resources
  /api/v1/resources/{id}:
    get:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resource
        '404':
          description: Not found in this workspace
  /api/v1/diagnostics:
    post:
      tags: [Diagnostics]
      security: [{ bearerAuth: [] }]
      summary: Enqueue an asynchronous diagnostic job
      requestBody:
        required: true
        content:
          application/json:
            example:
              idempotencyKey: demo-job-0001
              resourceTypes: [ec2, s3, lambda]
      responses:
        '202':
          description: Job accepted
        '200':
          description: Idempotent replay
  /api/v1/jobs:
    get:
      tags: [Diagnostics]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: Paginated jobs
  /api/v1/jobs/{id}:
    get:
      tags: [Diagnostics]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job
  /api/v1/jobs/{id}/retry:
    post:
      tags: [Diagnostics]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job requeued
  /api/v1/findings:
    get:
      tags: [Diagnostics]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: severity
          schema: { type: string }
        - in: query
          name: jobId
          schema: { type: string }
      responses:
        '200':
          description: Findings
  /api/v1/recommendations:
    get:
      tags: [Diagnostics]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recommendations
  /api/v1/remediations/plan:
    post:
      tags: [Remediations]
      security: [{ bearerAuth: [] }]
      summary: Create a dry-run remediation plan from findings
      requestBody:
        required: true
        content:
          application/json:
            example:
              findingIds: ['6650f0c2e1b2a3c4d5e6f7a8']
              dryRun: true
              idempotencyKey: plan-0001
      responses:
        '201':
          description: Plan created
  /api/v1/remediations/{id}/approve:
    post:
      tags: [Remediations]
      security: [{ bearerAuth: [] }]
      summary: Admin issues a single-use approval token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Approval token
  /api/v1/remediations/{id}/execute:
    post:
      tags: [Remediations]
      security: [{ bearerAuth: [] }]
      summary: Execute an approved plan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              approvalToken: abcd
              idempotencyKey: exec-0001
      responses:
        '200':
          description: Execution result including partial failures
  /api/v1/audit-events:
    get:
      tags: [Audit]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Immutable audit trail
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
